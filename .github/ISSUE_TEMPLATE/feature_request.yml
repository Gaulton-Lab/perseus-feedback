name: ✨ Feature Request
description: Suggest an idea or improvement for Perseus
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that Perseus currently makes hard or impossible?
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which application is this about?
      options:
        - Perseus
        - CFRD Genomics
        - Liver Genomics
        - Other (please specify in description)
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)

  - type: dropdown
    id: area
    attributes:
      label: Which part of Perseus does this relate to?
      options:
        - Locus/gene browser view
        - Cell type comparison
        - ABC links / target gene view
        - Variant scores / ChromBPNet display
        - Download / export
        - Site navigation / UI
        - Other
    validations:
      required: true
