name: 🐛 Bug Report
description: Something in Perseus isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out as much detail as you can.
  - type: dropdown
    id: app
    attributes:
      label: Which application is this about?
      options:
        - Perseus
        - CFRD Genomics
        - Liver Genomics
        - Other (please specify in description)
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      description: The exact Perseus URL (or locus/gene/cell type) where you saw the issue
      placeholder: "https://perseuskb.org/..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages if any appeared.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other (please specify below)
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag and drop an image here if helpful

  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Confirmation
      options:
        - label: I have not included any unpublished data or donor-identifiable information
          required: true
